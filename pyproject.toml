[project]
name = "myrtus-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argparse>=1.4.0",
    "pydantic>=2.11.5",
    "psutil>=5.9.0",
    "kubernetes>=33.1.0",
]

[dependency-groups]
dev = [
    "pylint>=3.3.7",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.12",
]

[tool.uv]
package = true

[project.scripts]
node-monitor = "monitor.node.main:main"
cluster-monitor = "monitor.cluster.main:main"

[tool.setuptools]
packages = ["monitor"]
