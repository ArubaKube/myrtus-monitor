apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: liqo-nodebind
webhooks:
  - admissionReviewVersions:
      - v1
      - v1beta1
    clientConfig:
      service:
        name: liqo-nodebind
        namespace: {{ .Release.Namespace }}
        path: /mutate/pod
        port: {{ .Values.deployment.container.args.webhookPort }}
    failurePolicy: Fail
    name: pod.mutate.liqo-nodebind.io
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    sideEffects: None
    objectSelector:
        matchExpressions:
          - key: liqo-nodebind.io/bind
            operator: Exists
    

