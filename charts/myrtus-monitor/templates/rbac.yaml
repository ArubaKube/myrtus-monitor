{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "myrtus-monitor.serviceAccountName" . }}
  labels:
    {{- include "myrtus-monitor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "myrtus-monitor.serviceAccountName" . }}
  labels:
    {{- include "myrtus-monitor.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "myrtus-monitor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "myrtus-monitor.serviceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
