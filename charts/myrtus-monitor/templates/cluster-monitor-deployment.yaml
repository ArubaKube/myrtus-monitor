{{- if .Values.clusterMonitor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-cluster-monitor
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-cluster-monitor
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: myrtus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-cluster-monitor
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-cluster-monitor
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "myrtus-monitor.serviceAccountName" . }}
      {{- if .Values.image.pullSecret.enabled }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: cluster-monitor
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - cluster-monitor
        args:
          - "--liqo-cluster-id={{ .Values.global.liqoClusterId }}"
          - "--kb-endpoint={{ .Values.global.kbEndpoint }}"
          - "--log-level={{ .Values.common.logLevel }}"
          - "--default-timeout={{ .Values.common.defaultTimeout }}"
          - "--default-period={{ .Values.common.defaultPeriod }}"
        resources:
          {{- toYaml .Values.clusterMonitor.resources | nindent 12 }}
        envFrom:
        - configMapRef:
            name: "{{ .Values.global.envConfigMapName }}"
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
